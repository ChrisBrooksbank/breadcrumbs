[build]
  command = "npm run build"
  publish = "dist"

# A PWA only updates when the browser re-fetches the service worker and the page that
# registers it, so neither may be served from cache.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
